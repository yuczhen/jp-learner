name: daily-telegram
on:
  schedule:
    - cron: "0 0 * * *"    # 08:00 Taiwan (UTC+8) -> morning batch
    - cron: "0 10 * * *"   # 18:00 Taiwan -> evening batch
  workflow_dispatch:
    inputs:
      slot: { description: "am or pm", default: "am" }
      date: { description: "test date YYYY-MM-DD (empty = today)", default: "" }
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests edge-tts cryptography
      - name: Pick slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then echo "v=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then echo "v=am" >> $GITHUB_OUTPUT
          else echo "v=pm" >> $GITHUB_OUTPUT; fi
      - name: Send
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
        run: python scripts/notify.py --slot ${{ steps.slot.outputs.v }} ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
